[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboodeploy"
version = "1.1.0"
description = "Scan and code-sign Windows .exe and .msi files from PyInstaller, Nuitka, or any build script via the Bamboo Deploy API. No certificate or hardware token to manage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Bamboo Deploy" }]
keywords = ["code-signing", "authenticode", "signtool", "windows", "pyinstaller", "nuitka", "smartscreen", "installer"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Security",
]

[project.urls]
Documentation = "https://www.bamboodeploy.com/docs/#python"
Source = "https://github.com/bamboodeploy/python-sign"

[project.scripts]
bamboo-sign = "bamboodeploy.cli:main"

[tool.setuptools.packages.find]
include = ["bamboodeploy*"]
